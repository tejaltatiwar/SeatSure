spring:
  application:
    name: seatsure-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seatsure}
    username: ${DB_USERNAME:seatsure}
    password: ${DB_PASSWORD:seatsure}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 60s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

server:
  port: 8080
  shutdown: graceful
  # Behind nginx every request arrives from the proxy's IP. "native" lets Tomcat read X-Forwarded-For
  # from trusted (private-range) proxies, so per-client rate limiting sees the real client address.
  forward-headers-strategy: native

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-please}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    auth-rate-limit-per-minute: 20
  booking:
    seat-hold-duration: 5m
    max-seats-per-booking: 6
    expiry-sweep-interval-ms: 30000
  kafka:
    booking-events-topic: booking-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - com.seatsure.payment.gateway.PaymentGatewayUnavailableException
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        record-exceptions:
          - com.seatsure.payment.gateway.PaymentGatewayUnavailableException

logging:
  level:
    com.seatsure: INFO
