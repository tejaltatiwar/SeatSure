server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container, so the browser stays same-origin (no CORS needed).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html so client-side routes work on reload.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
